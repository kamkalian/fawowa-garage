# FaWoWa-Garage: Anwendung und MySQL. Die Anwendung läuft hinter dem Caddy-Container (siehe Materialtabelle: deploy/caddy)
# im Netzwerk "caddy-net". Es wird absichtlich kein Port nach außen veröffentlicht: Docker würde die Firewall (ufw) umgehen.
# Die Datenbank hängt nur im internen Netzwerk "intern" ohne Verbindung nach außen, sie ist nur für die Anwendung erreichbar.
#
# Nötig in der .env neben diesem Ordner: DB_PASSWORD (siehe .env.example).

services:
  garage:
    build: .
    image: fawowa-garage:latest
    container_name: fawowa-garage
    restart: unless-stopped
    depends_on:
      garage-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3470
      - DB_HOST=garage-db
      - DB_NAME=garage
      - DB_USER=garage
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD fehlt in der .env}
      # Wegenetz für den Reichweiten-Planer (siehe deploy/netz-hochladen.ps1); fehlt es, bleibt der Planer abgeschaltet
      - NETZ_DIR=/app/netz
      - IMPORT_DIR=/app/import
    volumes:
      - ./data/netz:/app/netz:ro
      # Hochgeladene ZIP-Datei mit Wegenetz und Karte (Verwaltung schreibt, Worker packt aus)
      - ./data/import:/app/import
      # Stand der Kartendaten und Höhendaten (nur lesen, für die Verwaltung)
      # Fotos der Stellplätze (Docker-Volume, bleibt bei Neustarts erhalten)
      - fotos:/app/fotos
      # Vorab erzeugte Kacheln der Karte (Docker-Volume, bleibt bei Neustarts erhalten)
      - kacheln:/app/kacheln
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - caddy-net
      - intern

  # Hintergrundaufträge (Entpacken der hochgeladenen Karte, Reichweiten, Kacheln), nacheinander aus der Warteschlange (siehe lib/worker.js).
  # Eigener Container, damit ein großer Lauf den Webdienst nicht ausbremst. Das Wegenetz für ganz Deutschland hält er nur einmal im Speicher.
  garage-worker:
    image: fawowa-garage:latest
    build: .
    container_name: fawowa-garage-worker
    # Obergrenze für den Speicher: ein sehr großer Lauf trifft dann den Worker, nicht Datenbank und Webdienst (ohne Swap auf dem Server)
    # Das Wegenetz von Deutschland und der Kartenbau brauchen zusammen etwa 3 GB; der Rest läuft über den Swap des Servers
    mem_limit: 3584m
    # Der Worker hat keinen Webserver: den Gesundheitscheck des Webdienstes übernimmt er nicht
    healthcheck:
      disable: true
    restart: unless-stopped
    command: ["node", "lib/worker.js"]
    depends_on:
      garage-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DB_HOST=garage-db
      - DB_NAME=garage
      - DB_USER=garage
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD fehlt in der .env}
      - NETZ_DIR=/app/netz
      - IMPORT_DIR=/app/import
      - ROH_DIR=/app/roh
      - KACHEL_DIR=/app/kacheln
    volumes:
      # Wegenetz (schreibbar: der Netzbau legt es hier ab), Kartendaten aus dem Download, Höhendaten, Kacheln
      - ./data/netz:/app/netz
      - ./data/import:/app/import
      # Kartendaten (NRW) für den Kartenbau im Container
      - ./data/roh:/app/roh
      - kacheln:/app/kacheln
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Internet nur für den Download der Kartendaten
      - internet
      - intern

  garage-db:
    image: mysql:8.4
    container_name: fawowa-garage-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=garage
      - MYSQL_USER=garage
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD fehlt in der .env}
      # Das Root-Passwort wird zufällig erzeugt und nirgends gebraucht; die Anwendung nutzt nur den Benutzer "garage"
      - MYSQL_RANDOM_ROOT_PASSWORD=1
    # Sparsam für einen kleinen Server (4 GB RAM, geteilt mit weiteren Anwendungen)
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=96M
      - --max-connections=30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      # Prüft über TCP; während der Einrichtung beim ersten Start lauscht MySQL nur auf dem Socket und gilt damit noch nicht als bereit
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - intern

volumes:
  fotos:
  kacheln:

networks:
  caddy-net:
    external: true
  # Nur für den Worker: lädt die Kartendaten herunter
  internet:
  intern:
    internal: true
